name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check and test
        run: npm run check
      - name: Build frontend
        run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Windows delivery scripts (PowerShell 7)
        shell: pwsh
        run: ./scripts/windows/test-delivery.ps1
      - name: Check Windows delivery scripts (Windows PowerShell)
        shell: powershell
        run: ./scripts/windows/test-delivery.ps1
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
