name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (including React Hooks)
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check configuration and types
        run: npm run config:check && npm run typecheck && npm run typecheck:browser
      - name: Test with coverage thresholds
        run: npm run test:coverage
      - name: Require zero npm vulnerabilities
        run: npm run audit:deps
      - name: Build frontend
        run: npm run build
      - name: Preserve frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: error

  browser:
    name: Browser regression (native IPC mocked)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      # Keep the native CLI fixed; its npm package requires Node >=24.
      AGENT_BROWSER_VERSION: '0.41.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26.13.0'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Check browser test types
        run: npm run typecheck:browser
      - name: List every requested browser case without starting services
        run: ./scripts/windows/test-browser.ps1 -ListCases -Cases all
      - name: Install pinned browser tooling in the disposable CI runner
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'mdplus-browser-tools'
          npm install --prefix $tools --no-save --package-lock=false --no-audit --no-fund "agent-browser@$env:AGENT_BROWSER_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Browser tooling installation failed.' }
          $package = Get-Content -LiteralPath (Join-Path $tools 'node_modules/agent-browser/package.json') -Raw | ConvertFrom-Json
          if ($package.version -cne $env:AGENT_BROWSER_VERSION) { throw 'Unexpected browser tooling version.' }
          $browser = Join-Path $tools 'node_modules/agent-browser/bin/agent-browser-win32-x64.exe'
          if (!(Test-Path -LiteralPath $browser -PathType Leaf)) { throw 'Native browser runner is missing.' }
          & $browser --version
          if ($LASTEXITCODE -ne 0) { throw 'Browser runner version check failed.' }
          & $browser install
          if ($LASTEXITCODE -ne 0) { throw 'Browser binary installation failed.' }
          "MDPLUS_BROWSER=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run complete browser regression (not native app acceptance)
        run: |
          ./scripts/windows/test-browser.ps1 -Browser $env:MDPLUS_BROWSER -Cases all -EvidenceDirectory (Join-Path $env:GITHUB_WORKSPACE '.audit/browser-ci')
      - name: Preserve browser outcomes and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: .audit/browser-ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Use Node.js for coverage validation
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check Windows delivery scripts (PowerShell 7)
        shell: pwsh
        run: ./scripts/windows/test-delivery.ps1
      - name: Check Windows delivery scripts (Windows PowerShell)
        shell: powershell
        run: ./scripts/windows/test-delivery.ps1
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Install pinned coverage tooling
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Run native tests with production coverage
        run: >-
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --locked --json
          --output-path .audit/rust-coverage.json --ignore-filename-regex '(_tests\.rs|build\.rs)'
      - name: Enforce native coverage thresholds
        run: node scripts/check-rust-coverage.mjs .audit/rust-coverage.json
      - name: Preserve native coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: .audit/rust-coverage.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Run real Windows file symlink regressions
        id: real_symlinks
        shell: pwsh
        run: ./scripts/windows/test-real-symlinks.ps1
      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Preserve real symlink test outcomes and diagnostics
        if: always() && steps.real_symlinks.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: rust-real-symlinks
          path: .audit/real-symlinks-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
