<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MDPlus Icon Generator</title>
</head>
<body>
    <canvas id="canvas" width="512" height="512"></canvas>
    <div style="margin-top: 20px;">
        <button onclick="downloadPNG(512, 'icon.png')">Download 512x512</button>
        <button onclick="downloadPNG(256, 'icon-256.png')">Download 256x256</button>
        <button onclick="downloadPNG(128, '128x128@2x.png')">Download 128@2x</button>
        <button onclick="downloadPNG(64, '128x128.png')">Download 128x128</button>
        <button onclick="downloadPNG(32, '32x32.png')">Download 32x32</button>
    </div>

    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            const scale = size / 512;

            // 清空画布
            ctx.clearRect(0, 0, size, size);
            ctx.save();
            ctx.scale(scale, scale);

            // 背景渐变 - 现代蓝绿色
            const gradient = ctx.createLinearGradient(0, 0, 512, 512);
            gradient.addColorStop(0, '#0ea5e9');  // sky-500
            gradient.addColorStop(1, '#06b6d4');  // cyan-500

            // 圆角矩形背景
            const radius = 96;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(512 - radius, 0);
            ctx.quadraticCurveTo(512, 0, 512, radius);
            ctx.lineTo(512, 512 - radius);
            ctx.quadraticCurveTo(512, 512, 512 - radius, 512);
            ctx.lineTo(radius, 512);
            ctx.quadraticCurveTo(0, 512, 0, 512 - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();

            // 白色 Markdown "M" 标志和向下箭头组合
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#ffffff';

            // 绘制简化的 "M↓" 标志
            // M 字母
            ctx.lineWidth = 42;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(120, 320);
            ctx.lineTo(120, 180);
            ctx.lineTo(190, 240);
            ctx.lineTo(260, 180);
            ctx.lineTo(260, 320);
            ctx.stroke();

            // D 字母 (代表 Document)
            ctx.beginPath();
            ctx.moveTo(310, 180);
            ctx.lineTo(310, 320);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(335, 250, 70, -Math.PI/2, Math.PI/2, false);
            ctx.lineWidth = 38;
            ctx.stroke();

            // 加号符号 (表示增强版)
            ctx.lineWidth = 32;
            ctx.beginPath();
            ctx.moveTo(140, 380);
            ctx.lineTo(240, 380);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(190, 330);
            ctx.lineTo(190, 430);
            ctx.stroke();

            ctx.restore();
        }

        function downloadPNG(size, filename) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = size;
            tempCanvas.height = size;
            drawIcon(tempCanvas, size);

            tempCanvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        // 初始绘制
        const canvas = document.getElementById('canvas');
        drawIcon(canvas, 512);
    </script>
</body>
</html>
